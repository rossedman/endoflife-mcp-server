[project]
name = "endoflife-mcp-server"
dynamic = ["version"]
description = "An MCP server for endoflife.date: ask your AI assistant when your software stops getting support."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Ross Edman" }]
requires-python = ">=3.11"
keywords = ["mcp", "model-context-protocol", "endoflife", "eol", "lifecycle", "claude"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: System Administrators",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development",
    "Topic :: System :: Systems Administration",
    "Typing :: Typed",
]
dependencies = [
    "attrs>=25.4.0",
    "httpx>=0.28.1",
    "mcp>=2.3.0,<3",
    "pydantic-settings>=2.16.1",
    "python-dateutil>=2.9.0",
    "typer>=0.27.3",
]

[project.urls]
Homepage = "https://rossedman.io/endoflife-mcp-server/"
Documentation = "https://rossedman.io/endoflife-mcp-server/"
Source = "https://github.com/rossedman/endoflife-mcp-server"
Issues = "https://github.com/rossedman/endoflife-mcp-server/issues"
Changelog = "https://github.com/rossedman/endoflife-mcp-server/releases"

[project.scripts]
endoflife-mcp-server = "endoflife_mcp.cli:app"

[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[tool.hatch.version]
source = "vcs"

[tool.hatch.build.targets.sdist]
exclude = ["/.github", "/docs", "/overrides", "/site"]

[tool.hatch.build.targets.wheel]
packages = ["src/endoflife_mcp"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "SIM", "S", "N", "RUF", "PT", "C4", "D"]
# The client package is generated from api/external/endoflife.yaml; it is formatted but not linted.
exclude = ["src/endoflife_mcp/client/**"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]
"benchmarks/**" = ["S101"]

[tool.mypy]
strict = true
files = ["src", "tools"]

[[tool.mypy.overrides]]
module = ["endoflife_mcp.client", "endoflife_mcp.client.*"]
ignore_errors = true

[tool.pytest.ini_options]
addopts = "--cov=endoflife_mcp --cov-branch --cov-report=term-missing --cov-fail-under=90"
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = [
    "fuzz: Hypothesis property-based tests (run with -m fuzz)",
    "live: calls the real endoflife.date API (run with -m live)",
]
filterwarnings = ["error"]

[tool.coverage.run]
omit = ["src/endoflife_mcp/client/*"]

[tool.interrogate]
fail-under = 100
ignore-private = false
ignore-semiprivate = false
ignore-magic = true
ignore-init-method = true
exclude = ["tests", "benchmarks", "src/endoflife_mcp/client"]
verbose = 1

[dependency-groups]
dev = [
    "hypothesis>=6.170.12",
    "interrogate>=1.7.0",
    "mypy>=2.4.0",
    "openapi-schema-validator>=0.9.0",
    "openapi-spec-validator>=0.9.0",
    "pre-commit>=4.7.0",
    # pytest 9.2 removed Node._nodeid, which pytest-benchmark 5.3.0 still uses.
    "pytest>=9.1.1,<9.2",
    "pytest-asyncio>=1.4.1",
    "pytest-benchmark>=5.3.0",
    "pytest-cov>=7.1.0",
    "pyyaml>=6.0.3",
    "referencing>=0.37.0",
    "ruff>=0.17.3",
    "types-python-dateutil>=2.9.0.20261021",
]
docs = [
    "mkdocs>=1.6,<2",
    "mkdocs-material>=9.7,<10",
    "mkdocstrings[python]>=1.0.8",
]
