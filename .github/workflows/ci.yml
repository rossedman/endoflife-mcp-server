name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions: {}

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    name: Lint and type check
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          enable-cache: true
      - run: uv sync --locked --all-groups
      - name: Lint the OpenAPI spec
        run: uv run openapi-spec-validator api/external/endoflife.yaml
      - run: uv run ruff check --output-format=github
      - run: uv run ruff format --check
      - run: uv run mypy
      - name: Check docstrings
        run: uv run interrogate src tools
      - name: Check one command per file
        run: uv run python tools/check_cmds.py
      - name: Check the generated client is up to date
        run: make generate-check
      - name: Audit dependencies for known vulnerabilities
        run: |
          uv export --frozen --all-groups --no-emit-project --format requirements.txt -o "$RUNNER_TEMP/requirements.txt"
          uvx pip-audit --disable-pip -r "$RUNNER_TEMP/requirements.txt"

  test:
    name: Test (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12", "3.13", "3.14"]
    env:
      UV_PYTHON: ${{ matrix.python }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          enable-cache: true
      - run: uv python install
      - run: uv sync --locked --all-groups
      - name: Test with the coverage gate
        run: uv run pytest
      - name: Benchmarks (smoke run)
        run: uv run pytest benchmarks --no-cov --benchmark-disable
      - name: Fuzz (Hypothesis, ci profile)
        run: uv run pytest tests -m fuzz --no-cov --hypothesis-profile=ci

  build:
    name: Build package
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          enable-cache: true
      - run: uv build
      - run: uvx twine check --strict dist/*
      - name: Run the built wheel
        run: uv run --isolated --no-project --with dist/*.whl endoflife-mcp-server --version
